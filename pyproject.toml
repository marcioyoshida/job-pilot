[project]
name = "job-pilot"
version = "0.1.0"
description = "Assistive job-application pipeline: gather -> extract -> match -> tailor -> submit -> monitor"
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0",
    "boto3>=1.34",   # optional LLM path (Bedrock); rest of the pipeline works without it
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv]
# Virtual project: install the dependencies into .venv but don't try to build
# job-pilot itself as a wheel (the code lives under src/ and is run in place).
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
