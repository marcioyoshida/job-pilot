    text: "Built a serverless data pipeline on AWS (Lambda, Step Functions, S3) processing 10M events/day."
    skills: [python, aws, lambda, s3]
  - id: "b2"
    text: "Led migration of a monolith to containerized services on Kubernetes, cutting deploy time 60%."
    skills: [docker, kubernetes]
  - id: "b3"
    text: "Designed PostgreSQL schemas and query tuning for a fintech ledger handling BRL settlements."
    skills: [postgres, sql]

prefs:
  min_comp: null
  remote_only: true
