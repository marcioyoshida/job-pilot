# job-pilot candidate profile. Copy to config/candidate.yaml and edit.
# This holds PII-ish career data — config/candidate.yaml is gitignored.
#
# `skills` drives Stage 3 fit scoring. `master_bullets` is the superset of real
# resume bullets; Stage 4 (tailoring) selects from these and every tailored
# highlight must map back to a bullet id here (no fabrication).

name: "Your Name"
headline: "Staff Software Engineer"

skills:
  - Python
  - AWS
  - Lambda
  - DynamoDB
  - Terraform
  - PostgreSQL
  - Docker

master_bullets:
