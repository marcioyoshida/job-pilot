# job-pilot search profile (Phase P). Copy to config/search_profile.yaml and edit.
# Drives Stage 1 gathering (FR-1.2). Credentials NEVER go here — env/secret only.

titles:
  - "Staff Software Engineer"
  - "Senior Backend Engineer"
keywords:
  - "python"
  - "aws"
seniority:
  - "senior"
  - "staff"
locations:
  - "Remote"
  - "São Paulo"
remote_ok: true
industries:
  - "fintech"
exclude_terms:
  - "unpaid"
exclude_companies: []
recency_days: 14

# Greenhouse public job boards to poll (Phase P0, ToS-clean). Values are the
# board tokens from a company's boards.greenhouse.io/<token> URL.
greenhouse_boards:
  - "gitlab"
  - "coinbase"

# Lever public job boards to poll (Phase P0, ToS-clean). Values are the company
# tokens from a jobs.lever.co/<token> URL.
lever_companies:
  - "netflix"

# LinkedIn is ingested via job-ALERT EMAILS, not scraping (ToS-clean). Set up a
# saved search + email alert inside each LinkedIn account (Jobs → save search →
# alerts on). Those alert emails are parsed into postings by:
#   python run.py pipeline --linkedin-inbox alerts.json        # exported emails
#   python run.py pipeline --linkedin-gmail                    # GMAIL_* env creds
# The `keywords`/`titles`/`locations` above still filter what LinkedIn sends.
# No LinkedIn credentials or config are needed here.
